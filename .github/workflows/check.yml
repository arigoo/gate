name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    # 固定 24.04: ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26, 避免届时环境漂移
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          #
          # 注意: secret DOMAIN 必须是【完整地址且以 ?sstp=vpn:vpn@ 结尾】, 不是纯域名。
          #   正确: https://xxx.你的用户名.workers.dev/check?sstp=vpn:vpn@
          #   错误: xxx.你的用户名.workers.dev        (缺 scheme 与路径 -> MissingSchema)
          #   错误: https://xxx.你的用户名.workers.dev (缺 /check?sstp= -> 拼出畸形 host)
          # 脚本会把 host:port 直接拼在这个值后面, 所以末尾必须留 ?sstp=vpn:vpn@
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (build_type = workflow)"
            # Pages 的 source.path 只接受 "/" 或 "/docs", 传 /public 会被拒; 这里用 workflow 构建, path 固定 "/"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (deploy outcome: ${{ steps.deployment.outcome }})"'
